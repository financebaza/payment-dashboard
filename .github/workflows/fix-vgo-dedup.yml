name: Fix reciprocal VGO
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          old="""  async function loadPayments(){const res=await fetch(SUPABASE_URL+'/rest/v1/payments?select=id,entity,source,direction,amount,counterparty,project,subcategory,is_internal,is_non_expense&order=id.asc',{headers:authHeaders()});if(!res.ok)throw new Error('Не удалось загрузить платежи: HTTP '+res.status);const raw=(await res.json()).map(r=>({...r,amount:Number(r.amount),isInternal:r.is_internal===true,isNonExpense:r.is_non_expense===true}));window.__BAZA_ALL_PAYMENTS=raw.slice();const expenses=raw.filter(r=>!r.isNonExpense&&String(r.subcategory||'').trim().toLowerCase()!=='вго');window.PAYMENTS=expenses;PAY.length=0;PAY.push(...expenses);PAY=window.PAYMENTS;}"""
          new="""  async function loadPayments(){const res=await fetch(SUPABASE_URL+'/rest/v1/payments?select=id,entity,source,direction,amount,counterparty,project,subcategory,is_internal,is_non_expense&order=id.asc',{headers:authHeaders()});if(!res.ok)throw new Error('Не удалось загрузить платежи: HTTP '+res.status);const raw0=(await res.json()).map(r=>({...r,amount:Number(r.amount),isInternal:r.is_internal===true,isNonExpense:r.is_non_expense===true}));const seen=new Set();const raw=raw0.filter(r=>{if(!r.isInternal)return true;const a=String(r.entity||'').trim(),b=String(r.counterparty||'').trim();const key=[a,b,r.amount,r.project,r.subcategory].sort().join('|');if(seen.has(key))return false;seen.add(key);return true;});window.__BAZA_ALL_PAYMENTS=raw.slice();const expenses=raw.filter(r=>!r.isNonExpense&&String(r.subcategory||'').trim().toLowerCase()!=='вго');window.PAYMENTS=expenses;PAY.length=0;PAY.push(...expenses);PAY=window.PAYMENTS;}"""
          if old not in s: raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html; git commit -m 'Deduplicate reciprocal internal transfers'; git push

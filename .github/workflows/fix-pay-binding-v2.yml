name: Fix live payment binding
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-pay-binding-v2.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime binding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('renderAll();', 'render();')
          s = s.replace('approvals.clear();rows.forEach(x=>approvals.set(String(x.payment_id),x));', "approvals={};rows.forEach(x=>approvals[String(x.payment_id)]=x);")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'Fix dashboard render runtime'
            git push
          fi

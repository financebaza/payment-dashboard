name: Fix live payment binding
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-pay-binding-v2.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch payment state binding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "const PAY=Array.isArray(window.PAYMENTS)?window.PAYMENTS:[];"
          new = "let PAY=[];"
          if old in s:
              s = s.replace(old, new, 1)
          marker = "window.PAYMENTS=(await res.json()).map(r=>({...r,amount:Number(r.amount)}));"
          old2 = marker + "PAY.length=0;PAY.push(...window.PAYMENTS);"
          new2 = marker + "PAY=window.PAYMENTS;"
          if old2 in s:
              s = s.replace(old2, new2, 1)
          elif marker in s and "PAY=window.PAYMENTS;" not in s:
              s = s.replace(marker, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'Fix payment array binding'
            git push
          fi

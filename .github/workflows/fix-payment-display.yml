name: Fix payment display

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch payment binding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'window.PAYMENTS=(await res.json()).map(r=>({...r,amount:Number(r.amount)}));'
          replacement = marker + 'PAY.length=0;PAY.push(...window.PAYMENTS);'
          if 'PAY.length=0;PAY.push(...window.PAYMENTS);' not in s:
              if marker not in s:
                  raise SystemExit('Target payment loader not found')
              s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'Fix payment data binding'
            git push
          fi
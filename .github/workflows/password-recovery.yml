name: Fix password recovery
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch recovery flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'BAZA_AUTH_RECOVERY_V2'
          patch = r'''<script>
          /* BAZA_AUTH_RECOVERY_V2 */
          (function(){
            const PROD_URL='https://financebaza.github.io/payment-dashboard/';
            const redirectUrl=()=>PROD_URL;
            const authScreen=document.getElementById('authScreen');
            const form=document.getElementById('authForm');
            const title=form&&form.querySelector('h2');
            const note=form&&form.querySelector('.auth-guard-note');
            const submit=document.getElementById('authSubmit');
            const error=document.getElementById('authError');
            const password=document.getElementById('authPassword');
            const email=document.getElementById('authEmail');
            if(!form||!authScreen||!submit||!error||!password||!email)return;
            const forgot=document.createElement('button');
            forgot.type='button';forgot.textContent='Забыли пароль?';
            forgot.style='display:block;margin:10px auto 0;border:0;background:none;color:#2f75b5;font-size:10px;cursor:pointer';
            submit.insertAdjacentElement('afterend',forgot);
            let recovery=false;
            function showRecovery(){
              recovery=true;
              document.body.classList.remove('auth-ready');
              document.body.classList.add('auth-locked');
              authScreen.style.display='grid';
              if(title)title.textContent='Новый пароль';
              const p=form.querySelector('p');if(p)p.textContent='Введите новый пароль для доступа к платежному контролю.';
              email.parentElement.style.display='none';
              password.autocomplete='new-password';
              password.placeholder='Новый пароль';
              forgot.style.display='none';
              submit.textContent='Сохранить пароль';
              if(note)note.textContent='Ссылка восстановления активна · пароль обновляется через Supabase Auth.';
            }
            async function sendRecovery(){
              error.style.color='#c41d25';error.textContent='';
              const em=email.value.trim();
              if(!em){error.textContent='Введите email';return;}
              forgot.disabled=true;forgot.textContent='Отправляем…';
              try{
                const res=await fetch(SUPABASE_URL+'/auth/v1/recover',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:em,redirect_to:redirectUrl()})});
                if(!res.ok){const d=await res.json().catch(()=>({}));throw new Error(d.msg||d.error_description||'Не удалось отправить письмо');}
                error.style.color='#557e00';error.textContent='Письмо отправлено. Используйте только последнее письмо.';
              }catch(e){error.style.color='#c41d25';error.textContent=e.message||'Ошибка';}
              finally{forgot.disabled=false;forgot.textContent='Забыли пароль?';}
            }
            async function finishRecovery(){
              const h=new URLSearchParams(location.hash.replace(/^#/,'') );
              const at=h.get('access_token');
              const rt=h.get('refresh_token');
              const type=h.get('type');
              const authError=h.get('error_code')||h.get('error');
              if(authError){
                document.body.classList.add('auth-locked');
                authScreen.style.display='grid';
                error.style.color='#c41d25';
                error.textContent=authError==='otp_expired'?'Ссылка восстановления недействительна или уже использована. Запросите новое письмо.':(h.get('error_description')||authError);
                history.replaceState(null,'',location.pathname+location.search);
                return false;
              }
              if(!at||type!=='recovery')return false;
              localStorage.setItem('baza_access_token',at);
              if(rt)localStorage.setItem('baza_refresh_token',rt);
              showRecovery();
              history.replaceState(null,'',location.pathname+location.search);
              return true;
            }
            forgot.onclick=sendRecovery;
            form.addEventListener('submit',async function(e){
              if(!recovery)return;
              e.preventDefault();
              e.stopImmediatePropagation();
              error.style.color='#c41d25';error.textContent='';
              const pw=password.value;
              if(pw.length<8){error.textContent='Пароль должен быть не короче 8 символов';return;}
              submit.disabled=true;submit.textContent='Сохраняем…';
              try{
                const token=localStorage.getItem('baza_access_token');
                if(!token)throw new Error('Сессия восстановления не найдена. Запросите новое письмо.');
                const res=await fetch(SUPABASE_URL+'/auth/v1/user',{method:'PUT',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
                const d=await res.json().catch(()=>({}));
                if(!res.ok)throw new Error(d.msg||d.error_description||d.message||'Не удалось изменить пароль');
                localStorage.removeItem('baza_access_token');localStorage.removeItem('baza_refresh_token');
                error.style.color='#557e00';error.textContent='Пароль изменён. Теперь войдите с новым паролем.';
                recovery=false;
                if(title)title.textContent='Вход в систему';
                const p=form.querySelector('p');if(p)p.textContent='Доступ к платежному календарю только для авторизованных пользователей.';
                email.parentElement.style.display='block';password.value='';password.placeholder='';password.autocomplete='current-password';forgot.style.display='block';submit.textContent='Войти';
                if(note)note.textContent='Сессия защищена Supabase Auth · данные платежей загружаются только после входа.';
              }catch(e){error.textContent=e.message||'Ошибка';}
              finally{submit.disabled=false;if(recovery)submit.textContent='Сохранить пароль';}
            },true);
            finishRecovery();
          })();
          </script>'''
          pattern = r'<script>\s*/\* BAZA_AUTH_RECOVERY_V[12] \*/.*?</script>'
          if re.search(pattern, s, flags=re.S):
              s = re.sub(pattern, patch, s, count=1, flags=re.S)
          elif marker not in s:
              s = s.replace('</body>', patch+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
          if grep -q 'BAZA_AUTH_RECOVERY_V2' index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Fix production password recovery handler" || true
            git push
          fi

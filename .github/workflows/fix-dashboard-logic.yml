name: Fix dashboard logic
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize payment flow classification
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('data.js')
          s=p.read_text(encoding='utf-8')

          marker='/* BAZA_FILTER_SHIM */'
          if marker in s:
              s=s.split(marker,1)[0].rstrip()+"\n"

          shim=r'''/* BAZA_FILTER_SHIM */
          (function(){
            function flowType(r){
              // The subcategory/article is NOT used to determine cash-flow direction.
              // In this registry `entity` is our legal entity / payer. Therefore a normal
              // row is an expense. Explicit flags identify non-expense movements.
              if(r.isInternal) return 'internal';
              if(r.isNonExpense) return 'income';
              return 'expense';
            }
            window.PAYMENTS = window.PAYMENTS.map(r=>Object.assign({},r,{flowType:flowType(r)}));

            const originalFilter=Array.prototype.filter;
            Array.prototype.filter=function(callback,thisArg){
              const result=originalFilter.call(this,callback,thisArg);
              if(this===window.PAYMENTS && callback && callback.name==='matches'){
                try{
                  const stack=new Error().stack||'';
                  if(stack.includes('renderKpi')||stack.includes('renderDash')){
                    return result.filter(r=>r.flowType==='expense');
                  }
                }catch(e){}
              }
              return result;
            };
          })();
          '''
          p.write_text(s+shim,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git diff --cached --quiet || git commit -m "Fix flow classification"
          git push

name: Auth numeric hotfix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply numeric conversion
        shell: bash
        run: |
          if ! grep -q 'BAZA_AUTH_NUMERIC_V1' index.html; then
            python3 auth-numeric-hotfix.py
            rm -f auth-numeric-hotfix.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Normalize payment amounts after secure fetch"
            git push
          fi

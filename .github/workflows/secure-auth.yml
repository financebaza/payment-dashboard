name: Secure dashboard auth
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply secure auth patch
        shell: bash
        run: |
          if ! grep -q 'BAZA_AUTH_V1' index.html; then
            python3 secure-auth-patch.py
            rm -f secure-auth-patch.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Secure dashboard with Supabase authentication"
            git push
          fi
